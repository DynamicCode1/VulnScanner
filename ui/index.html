<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SentinelAPI — API vulnerability scanner</title>
    <script>
      // Applied before first paint so a light-mode visitor never sees a dark flash.
      try {
        if (localStorage.getItem('sentinel-theme') === 'light') {
          document.documentElement.classList.remove('dark')
        }
      } catch (error) {
        /* storage unavailable — keep the dark default */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
